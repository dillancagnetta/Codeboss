# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master, develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # SDK Version to use; x will use the latest version of the channel
      - run: dotnet build -c release

      - name: Run unit tests
        run: dotnet test -c release --no-build --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

      # Separate step so the unit results above always report even if Docker is unavailable.
      # Needs a Docker daemon (ubuntu-latest has one) for the Testcontainers PostgreSQL fixture.
      #
      # Selected by FILTER against the solution, mirroring the unit step above, rather than by
      # passing the test project path. The project-path form failed on the runner with "The
      # argument <dll> is invalid" while passing locally; the filter form names no test
      # container and is the same invocation shape the unit step already proves works.
      - name: Run integration tests
        run: dotnet test -c release --no-build --verbosity normal --filter "FullyQualifiedName~IntegrationTests"

      # Runs a single command using the runners shell
      - name: Run pack.sh script
        env:          
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          chmod -R a+x scripts
          chmod -R a+x src
          ./scripts/pack.sh
